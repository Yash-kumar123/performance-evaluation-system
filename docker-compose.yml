version: '3.8'

services:
  # 1. PostgreSQL Relational Database Service
  db:
    image: postgres:15-alpine
    container_name: pes-db
    restart: always
    environment:
      POSTGRES_DB: performance_eval_db
      POSTGRES_USER: pes_user
      POSTGRES_PASSWORD: pes_secure_password_2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pes_user -d performance_eval_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Express API Backend & Flutter Web Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pes-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: performance_eval_db
      DB_USER: pes_user
      DB_PASSWORD: pes_secure_password_2026!
      JWT_SECRET: super_secret_jwt_key_pes_2026_prod
      JWT_EXPIRES_IN: 1d
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npm run seed && node server.js"

volumes:
  postgres_data:
