name: performance_evaluation_app
description: "A Multi-Tenant Performance Evaluation System built with Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  dio: ^5.5.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

# Pin path_provider_android to avoid jni-1.0.1 which breaks Gradle builds
# with: "Could not find method kotlin() for arguments on project ':jni'"
dependency_overrides:
  path_provider_android: 2.2.10

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_logo.png
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: assets/branding/app_logo.png
  web:
    generate: true
    image_path: assets/branding/app_logo.png
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
  windows:
    generate: true
    image_path: assets/branding/app_logo.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png
